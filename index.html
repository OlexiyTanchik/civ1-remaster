<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Civilization — a 1991 remaster in your browser</title>
    <meta name="description" content="Sid Meier's Civilization (1991) in your browser: from a single band of settlers to a starship to Alpha Centauri. Pixel art, AI rivals, diplomacy, the space race. English and Ukrainian. TypeScript + PixiJS." />
    <meta name="description" lang="uk" content="Покрокова стратегія Civilization (1991) у браузері: від одного поселенця до польоту на Альфу Центавра. Піксельна графіка, AI-суперники, дипломатія, космічна гонка. Англійською й українською." />
    <meta name="theme-color" content="#050811" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="uk_UA" />
    <meta property="og:title" content="Civilization — a 1991 remaster in your browser" />
    <meta property="og:description" content="From a single band of settlers to Alpha Centauri: the classic turn-based strategy with AI rivals, diplomacy and the space race. Play free in your browser — in English or Ukrainian (українською)." />
    <meta property="og:image" content="https://olexiytanchik.github.io/civ1-remaster/og-image.png" />
    <meta property="og:url" content="https://olexiytanchik.github.io/civ1-remaster/" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Заставка до першого кадру гри: знімає main.ts -->
    <div id="boot-loader" class="boot-loader">
      <div class="boot-title">CIVILIZATION</div>
      <div class="boot-text" id="boot-text">Завантаження…</div>
      <div class="boot-bar"><span></span></div>
    </div>
    <div id="app">
      <div id="sidebar-container"></div>
      <div id="game-main">
        <header id="message-log" class="civ-ticker">
          <span class="log-entry">Ласкаво просимо! Заснуйте столицю й ведіть свій народ від бронзи до зірок. Довідка — F1, кінець ходу — Enter.</span>
        </header>
        <main id="canvas-container"></main>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
